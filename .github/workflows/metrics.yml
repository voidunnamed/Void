name: Generate Stable Arcane Metrics

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: stable-arcane-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate core RPG analytics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: voidunnamed
          filename: metrics.rpg.svg
          output_action: commit
          committer_message: "chore: refresh stable RPG analytics [skip ci]"
          template: classic
          base: header, activity
          config_timezone: Europe/Paris
          config_animations: yes
          config_twemoji: yes
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 4
          plugins_errors_fatal: yes

      - name: Generate quest archive
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: voidunnamed
          filename: metrics.quests.svg
          output_action: commit
          committer_message: "chore: refresh quest archive [skip ci]"
          base: ""
          config_animations: yes
          config_twemoji: yes
          plugin_repositories: yes
          plugin_repositories_featured: >-
            voidunnamed/CozyHousePlugin,
            voidunnamed/EnchantPlusMod,
            voidunnamed/LegacyCombat---alpha-0.1
          plugins_errors_fatal: yes
