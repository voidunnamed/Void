name: Generate Arcane MMO Metrics

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: arcane-mmo-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Core arcane dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: voidunnamed
          filename: metrics.rpg.svg
          output_action: commit
          committer_message: "chore: update core RPG metrics [skip ci]"
          template: classic
          base: header
          config_timezone: Europe/Paris
          config_animations: yes
          config_twemoji: yes
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 4
          plugins_errors_fatal: no

      - name: Chronomancy - coding habits
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: voidunnamed
          filename: metrics.chronomancy.svg
          output_action: commit
          committer_message: "chore: update chronomancy metrics [skip ci]"
          base: ""
          config_timezone: Europe/Paris
          config_animations: yes
          config_twemoji: yes
          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes
          plugin_habits_languages_limit: 6
          plugins_errors_fatal: no

      - name: Achievement grimoire
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: voidunnamed
          filename: metrics.achievements.svg
          output_action: commit
          committer_message: "chore: update achievement grimoire [skip ci]"
          base: ""
          config_animations: yes
          config_twemoji: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: X
          plugin_achievements_secrets: yes
          plugins_errors_fatal: no

      - name: Java spell fragment
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: voidunnamed
          filename: metrics.grimoire.svg
          output_action: commit
          committer_message: "chore: update Java spell fragment [skip ci]"
          base: ""
          config_animations: yes
          config_twemoji: yes
          plugin_code: yes
          plugin_code_languages: java
          plugin_code_load: 500
          plugin_code_days: 365
          plugin_code_lines: 12
          plugins_errors_fatal: no

      - name: Quest archive - featured repositories
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: voidunnamed
          filename: metrics.quests.svg
          output_action: commit
          committer_message: "chore: update quest archive [skip ci]"
          base: ""
          config_animations: yes
          config_twemoji: yes
          plugin_repositories: yes
          plugin_repositories_featured: >-
            voidunnamed/CozyHousePlugin,
            voidunnamed/EnchantPlusMod,
            voidunnamed/LegacyCombat---alpha-0.1
          plugins_errors_fatal: no

      - name: End skyline
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: voidunnamed
          filename: metrics.skyline.svg
          output_action: commit
          committer_message: "chore: update End skyline [skip ci]"
          base: ""
          config_animations: yes
          config_twemoji: yes
          plugin_skyline: yes
          plugin_skyline_year: 2026
          plugins_errors_fatal: no
