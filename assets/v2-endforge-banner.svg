<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090611"/>
    <stop offset=".45" stop-color="#160d26"/>
    <stop offset="1" stop-color="#2d1746"/>
  </linearGradient>
  <linearGradient id="portal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7c3aed"/>
    <stop offset=".5" stop-color="#c084fc"/>
    <stop offset="1" stop-color="#4c1d95"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="420" fill="url(#bg)"/>
<ellipse cx="600" cy="330" rx="430" ry="75" fill="#6d28d9" opacity=".14" filter="url(#soft)"/>
<g fill="#d8b4fe" opacity=".8">
  <circle cx="95" cy="74" r="2"/><circle cx="178" cy="121" r="1.5"/><circle cx="275" cy="53" r="2"/>
  <circle cx="390" cy="98" r="1.7"/><circle cx="522" cy="52" r="1.2"/><circle cx="676" cy="92" r="2"/>
  <circle cx="812" cy="57" r="1.5"/><circle cx="945" cy="111" r="2"/><circle cx="1082" cy="69" r="1.6"/>
  <circle cx="1130" cy="152" r="1.2"/><circle cx="59" cy="173" r="1.4"/>
</g>
<!-- End portal -->
<g filter="url(#glow)">
  <ellipse cx="600" cy="309" rx="150" ry="48" fill="none" stroke="url(#portal)" stroke-width="10" opacity=".9"/>
  <ellipse cx="600" cy="309" rx="118" ry="33" fill="#8b5cf6" opacity=".18"/>
</g>
<!-- castle silhouette -->
<g fill="#0b0711" stroke="#3b2357" stroke-width="2">
  <rect x="430" y="216" width="340" height="112" rx="3"/>
  <rect x="470" y="170" width="70" height="158"/>
  <rect x="660" y="170" width="70" height="158"/>
  <rect x="554" y="140" width="92" height="188"/>
  <polygon points="465,170 505,128 545,170"/>
  <polygon points="655,170 695,128 735,170"/>
  <polygon points="548,140 600,86 652,140"/>
  <rect x="398" y="245" width="42" height="83"/>
  <rect x="760" y="245" width="42" height="83"/>
  <polygon points="392,245 419,216 446,245"/>
  <polygon points="754,245 781,216 808,245"/>
</g>
<g fill="#c084fc" filter="url(#glow)">
  <rect x="493" y="205" width="18" height="34" rx="8"/><rect x="689" y="205" width="18" height="34" rx="8"/>
  <rect x="589" y="179" width="22" height="42" rx="10"/>
</g>
<!-- floating block cubes -->
<g stroke="#8b5cf6" stroke-width="2">
  <g transform="translate(205 235)">
    <polygon points="0,20 34,0 68,20 34,40" fill="#3b2357"/>
    <polygon points="0,20 34,40 34,78 0,58" fill="#1f1230"/>
    <polygon points="68,20 34,40 34,78 68,58" fill="#2b1842"/>
  </g>
  <g transform="translate(925 205) scale(.8)">
    <polygon points="0,20 34,0 68,20 34,40" fill="#46305f"/>
    <polygon points="0,20 34,40 34,78 0,58" fill="#241431"/>
    <polygon points="68,20 34,40 34,78 68,58" fill="#321b47"/>
  </g>
</g>
<!-- title -->
<text x="600" y="74" text-anchor="middle" fill="#f5f3ff" font-size="54" font-weight="800" font-family="Georgia,serif" letter-spacing="10">VOID</text>
<text x="600" y="111" text-anchor="middle" fill="#c4b5fd" font-size="18" font-family="Georgia,serif" letter-spacing="4">THE END-FORGED CODEX</text>
