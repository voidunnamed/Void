  <radialGradient id="portal"><stop stop-color="#e9d5ff"/><stop offset=".35" stop-color="#c084fc"/><stop offset=".72" stop-color="#7c3aed"/><stop offset="1" stop-color="#2e1065"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1400" height="430" fill="url(#bg)"/>
