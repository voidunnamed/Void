  <rect x="602" y="220" width="18" height="36" rx="8"><animate attributeName="opacity" values=".35;1;.35" dur="2.6s" repeatCount="indefinite"/></rect>
  <rect x="780" y="220" width="18" height="36" rx="8"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/></rect>
